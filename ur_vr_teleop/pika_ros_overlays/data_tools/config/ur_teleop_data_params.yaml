      camera:
        color:
          names: ['pikaGripperDepthCamera', 'orbbecCamera']
          parentFrames: ['gripper/camera_link', 'orbbec/camera_link']
          topics: ['/gripper/camera/color/image_raw', '/orbbec/color/image_raw']
          configTopics: ['/gripper/camera/color/camera_info', '/orbbec/color/camera_info']
